<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#05070C"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1E4FA8" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#1E4FA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14305F"/>
      <stop offset="100%" stop-color="#0C1A34"/>
    </linearGradient>
    <linearGradient id="nodeRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A1020"/>
      <stop offset="100%" stop-color="#2A0A12"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#3B7DE0"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 Z" fill="#E01E33"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#bloom)"/>

  <text x="72" y="86" fill="#E8EEF9" font-size="38" font-weight="700" letter-spacing="-.5">AI Lead Pipeline</text>
  <text x="72" y="122" fill="#7E93B8" font-size="18">Social scraping &rarr; qualification &rarr; WhatsApp &rarr; AI voice callback &rarr; automated quotation</text>
  <line x1="72" y1="150" x2="1528" y2="150" stroke="#1E4FA8" stroke-opacity=".3" stroke-width="1"/>

  <!-- phase labels -->
  <text x="72" y="205" fill="#3B7DE0" font-size="13" letter-spacing=".22em">ACQUIRE</text>
  <text x="675" y="205" fill="#3B7DE0" font-size="13" letter-spacing=".22em">QUALIFY</text>
  <text x="1135" y="205" fill="#E01E33" font-size="13" letter-spacing=".22em">ENGAGE</text>

  <!-- ROW 1 -->
  <g>
    <rect x="72" y="230" width="250" height="118" rx="14" fill="url(#node)" stroke="#1E4FA8" stroke-opacity=".55"/>
    <text x="197" y="278" fill="#E8EEF9" font-size="19" font-weight="600" text-anchor="middle">Facebook Groups</text>
    <text x="197" y="304" fill="#E8EEF9" font-size="19" font-weight="600" text-anchor="middle">+ Instagram</text>
    <text x="197" y="328" fill="#7E93B8" font-size="14" text-anchor="middle">source posts</text>
  </g>
  <line x1="322" y1="289" x2="372" y2="289" stroke="#3B7DE0" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="382" y="230" width="250" height="118" rx="14" fill="url(#node)" stroke="#1E4FA8" stroke-opacity=".55"/>
    <text x="507" y="278" fill="#E8EEF9" font-size="19" font-weight="600" text-anchor="middle">Custom Python</text>
    <text x="507" y="304" fill="#E8EEF9" font-size="19" font-weight="600" text-anchor="middle">Scraper</text>
    <text x="507" y="328" fill="#7E93B8" font-size="14" text-anchor="middle">runs daily, unattended</text>
  </g>
  <line x1="632" y1="289" x2="682" y2="289" stroke="#3B7DE0" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="692" y="230" width="250" height="118" rx="14" fill="url(#node)" stroke="#1E4FA8" stroke-opacity=".55"/>
    <text x="817" y="286" fill="#E8EEF9" font-size="19" font-weight="600" text-anchor="middle">Intent Filter</text>
    <text x="817" y="314" fill="#7E93B8" font-size="14" text-anchor="middle">real buyers, not noise</text>
  </g>
  <line x1="942" y1="289" x2="992" y2="289" stroke="#3B7DE0" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="1002" y="230" width="250" height="118" rx="14" fill="url(#node)" stroke="#1E4FA8" stroke-opacity=".55"/>
    <text x="1127" y="286" fill="#E8EEF9" font-size="19" font-weight="600" text-anchor="middle">Google Sheets</text>
    <text x="1127" y="314" fill="#7E93B8" font-size="14" text-anchor="middle">lead + source record</text>
  </g>
  <line x1="1252" y1="289" x2="1302" y2="289" stroke="#3B7DE0" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="1312" y="230" width="216" height="118" rx="14" fill="url(#node)" stroke="#1E4FA8" stroke-opacity=".55"/>
    <text x="1420" y="286" fill="#E8EEF9" font-size="19" font-weight="600" text-anchor="middle">WhatsApp Intro</text>
    <text x="1420" y="314" fill="#7E93B8" font-size="14" text-anchor="middle">UltraMsg</text>
  </g>

  <!-- connector down -->
  <path d="M1420 348 L1420 430 L1420 470" fill="none" stroke="#E01E33" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- ROW 2 (right to left) -->
  <g>
    <rect x="1312" y="480" width="216" height="132" rx="14" fill="url(#nodeRed)" stroke="#E01E33" stroke-opacity=".75"/>
    <text x="1420" y="528" fill="#FFE9EC" font-size="19" font-weight="700" text-anchor="middle">Retell AI</text>
    <text x="1420" y="554" fill="#FFE9EC" font-size="19" font-weight="700" text-anchor="middle">Voice Agent</text>
    <text x="1420" y="582" fill="#F4A6B2" font-size="14" text-anchor="middle">calls back &amp; qualifies</text>
  </g>
  <line x1="1312" y1="546" x2="1262" y2="546" stroke="#E01E33" stroke-width="2" marker-end="url(#arrowRed)"/>

  <g>
    <rect x="1002" y="480" width="250" height="132" rx="14" fill="url(#node)" stroke="#1E4FA8" stroke-opacity=".55"/>
    <text x="1127" y="536" fill="#E8EEF9" font-size="19" font-weight="600" text-anchor="middle">Quotation Engine</text>
    <text x="1127" y="564" fill="#7E93B8" font-size="14" text-anchor="middle">live pricing rules</text>
  </g>
  <line x1="1002" y1="546" x2="952" y2="546" stroke="#3B7DE0" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="692" y="480" width="250" height="132" rx="14" fill="url(#node)" stroke="#1E4FA8" stroke-opacity=".55"/>
    <text x="817" y="536" fill="#E8EEF9" font-size="19" font-weight="600" text-anchor="middle">Measurement</text>
    <text x="817" y="564" fill="#E8EEF9" font-size="19" font-weight="600" text-anchor="middle">Reminders</text>
  </g>

  <!-- runner band -->
  <rect x="72" y="700" width="1456" height="104" rx="14" fill="#0A1428" stroke="#1E4FA8" stroke-opacity=".35"/>
  <text x="104" y="742" fill="#3B7DE0" font-size="13" letter-spacing=".22em">JOB RUNNER</text>
  <text x="104" y="776" fill="#E8EEF9" font-size="18">One process per task &middot; no overlapping runs &middot; customer contact restricted to weekdays, 9am&ndash;7pm</text>

  <text x="72" y="858" fill="#54688C" font-size="15">Python &middot; Apify &middot; UltraMsg &middot; Retell AI &middot; n8n &middot; Google Sheets &amp; Calendar</text>
</svg>
